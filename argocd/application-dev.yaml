apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Jinzo03/devops-project.git'
    targetRevision: HEAD
    path: helm/fastapi-app
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true